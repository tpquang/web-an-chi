services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anchi
      POSTGRES_PASSWORD: anchi_dev
      POSTGRES_DB: anchi
    ports:
      # 5433 để không đụng Postgres cài sẵn trên máy (5432)
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchi -d anchi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
